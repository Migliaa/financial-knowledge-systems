<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="760" fill="#ffffff"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">
    M1 — pipeline di retrieval: due tracce indipendenti, poi fusione e reranking
  </text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#666">
    Schema didattico dell'ordine delle fasi. Nessun tempo, punteggio o risultato misurato.
  </text>

  <!-- Indicizzazione -->
  <rect x="90" y="75" width="780" height="60" rx="8" fill="#f2f2f2" stroke="#999"/>
  <text x="480" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Indicizzazione documenti — una tantum, offline</text>
  <text x="480" y="118" text-anchor="middle" font-size="12" fill="#444">indice BM25 (conteggi/pesi per parola) · vettori-documento precalcolati (embedding + pooling di ogni passaggio)</text>

  <!-- Query -->
  <rect x="410" y="160" width="140" height="40" rx="8" fill="#e8eefc" stroke="#3b5fc0"/>
  <text x="480" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#1f3a8a">Query</text>

  <line x1="480" y1="200" x2="270" y2="235" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="200" x2="690" y2="235" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BM25 track -->
  <rect x="70" y="240" width="400" height="230" rx="10" fill="#fff7e8" stroke="#c98a1a"/>
  <text x="270" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a10">Traccia lessicale — BM25</text>

  <rect x="100" y="278" width="340" height="34" rx="6" fill="#ffffff" stroke="#c98a1a"/>
  <text x="270" y="300" text-anchor="middle" font-size="12" fill="#333">tokenizzazione classica (parole intere)</text>
  <line x1="270" y1="312" x2="270" y2="330" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="100" y="330" width="340" height="34" rx="6" fill="#ffffff" stroke="#c98a1a"/>
  <text x="270" y="352" text-anchor="middle" font-size="12" fill="#333">punteggio per parola: frequenza, rarità, lunghezza</text>
  <line x1="270" y1="364" x2="270" y2="382" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="100" y="382" width="340" height="34" rx="6" fill="#fff0d0" stroke="#c98a1a"/>
  <text x="270" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#333">Classifica A — ordinata per punteggio BM25</text>

  <text x="270" y="455" text-anchor="middle" font-size="11" fill="#8a5a10">nessun embedding coinvolto in questa traccia</text>

  <!-- Embedding track -->
  <rect x="490" y="240" width="400" height="410" rx="10" fill="#eaf6ee" stroke="#1f8a4c"/>
  <text x="690" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#155c33">Traccia semantica — embedding</text>

  <rect x="520" y="278" width="340" height="30" rx="6" fill="#ffffff" stroke="#1f8a4c"/>
  <text x="690" y="298" text-anchor="middle" font-size="11.5" fill="#333">tokenizzazione sub-word → ID</text>
  <line x1="690" y1="308" x2="690" y2="324" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="520" y="324" width="340" height="30" rx="6" fill="#ffffff" stroke="#1f8a4c"/>
  <text x="690" y="344" text-anchor="middle" font-size="11.5" fill="#333">tabella di embedding (lookup, statico)</text>
  <line x1="690" y1="354" x2="690" y2="370" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="520" y="370" width="340" height="30" rx="6" fill="#ffffff" stroke="#1f8a4c"/>
  <text x="690" y="390" text-anchor="middle" font-size="11.5" fill="#333">forward pass (strati transformer, contestuale)</text>
  <line x1="690" y1="400" x2="690" y2="416" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="520" y="416" width="340" height="30" rx="6" fill="#ffffff" stroke="#1f8a4c"/>
  <text x="690" y="436" text-anchor="middle" font-size="11.5" fill="#333">pooling: N vettori-token → 1 vettore-query</text>
  <line x1="690" y1="446" x2="690" y2="462" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="520" y="462" width="340" height="30" rx="6" fill="#ffffff" stroke="#1f8a4c"/>
  <text x="690" y="482" text-anchor="middle" font-size="11.5" fill="#333">coseno uno-contro-tutti vs vettori-documento</text>
  <line x1="690" y1="492" x2="690" y2="508" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="520" y="508" width="340" height="30" rx="6" fill="#e2f5e8" stroke="#1f8a4c"/>
  <text x="690" y="528" text-anchor="middle" font-size="12" font-weight="600" fill="#333">Classifica B — ordinata per coseno</text>

  <text x="690" y="560" text-anchor="middle" font-size="11" fill="#155c33">vettori-documento presi dall'indicizzazione (sopra)</text>
  <line x1="690" y1="135" x2="690" y2="278" stroke="#1f8a4c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Convergenza -->
  <line x1="270" y1="416" x2="480" y2="600" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="538" x2="480" y2="600" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="600" width="300" height="40" rx="8" fill="#f3e9ff" stroke="#7a3fc9"/>
  <text x="480" y="625" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a1f7a">Fusione RRF — solo posizioni, non punteggi</text>
  <line x1="480" y1="640" x2="480" y2="656" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="330" y="656" width="300" height="30" rx="6" fill="#ffffff" stroke="#7a3fc9"/>
  <text x="480" y="676" text-anchor="middle" font-size="11.5" fill="#333">classifica fusa — primi ~20 candidati</text>
  <line x1="480" y1="686" x2="480" y2="702" stroke="#333" marker-end="url(#arrow)"/>

  <rect x="300" y="702" width="360" height="34" rx="8" fill="#fde8e8" stroke="#b23a3a"/>
  <text x="480" y="723" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a1f1f">Reranking cross-encoder — query+doc insieme → primi 10</text>
</svg>
